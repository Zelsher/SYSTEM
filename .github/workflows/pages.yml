# Index des systèmes (ADR 0140 d'ARRSA) : assemble entrees/*.json en index/static et le publie
# sur GitHub Pages, où Flatpak le lit (dépôt oci+https://zelsher.github.io/arrsa-systemes).
# Pages sert avec Cache-Control: max-age=600 : une nouvelle version se voit en 10 minutes au plus.
name: Index des systèmes

on:
  push:
    branches: [main]
    paths:
      - "entrees/**"
      - "outils/assembler.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assembler l'index
        run: python3 -I outils/assembler.py entrees site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
