# Index des systèmes (ADR 0140 d'ARRSA) : assemble entrees/*.json en index/static et le publie
# sur GitHub Pages, où Flatpak le lit (dépôt oci+https://zelsher.github.io/arrsa-systemes).
# Pages sert avec Cache-Control: max-age=600 : une nouvelle version se voit en 10 minutes au plus.
name: Index des systèmes

on:
  push:
    branches: [main]
    paths:
      - "entrees/**"
      - "outils/assembler.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assembler l'index
        run: python3 -I outils/assembler.py entrees site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
