# Publier un système (ADR 0140 d'ARRSA) : appelée par l'intégration continue du système, depuis
# son propre dépôt (privé). Construit son Flatpak, le pousse en image OCI privée sur
# ghcr.io/<propriétaire>/<paquet>, puis écrit son entrée dans entrees/ de ce dépôt-ci ; pages.yml
# en refait l'index que lisent les machines. Seules les métadonnées de l'image sortent ici.
#
# Dans le dépôt du système :
#   jobs:
#     publier:
#       uses: Zelsher/arrsa-systemes/.github/workflows/publier.yml@main
#       permissions: { contents: read, packages: write }
#       with: { manifeste: flatpak/org.arrsa.Atlas.yml, appli: org.arrsa.Atlas, paquet: systemes-atlas }
#       secrets: { INDEX_TOKEN: "${{ secrets.INDEX_TOKEN }}" }
#
# INDEX_TOKEN : jeton fine-grained limité à Zelsher/arrsa-systemes, droit Contents en écriture.
# Le jeton automatique du système ne peut pas écrire dans un autre dépôt.
name: Publier un système

on:
  workflow_call:
    inputs:
      manifeste:
        description: Manifeste flatpak-builder, chemin dans le dépôt du système
        required: true
        type: string
      appli:
        description: Identifiant Flatpak (org.arrsa.Atlas)
        required: true
        type: string
      paquet:
        description: Nom de l'image sur ghcr.io, sans le propriétaire (systemes-atlas)
        required: true
        type: string
      branche:
        description: Branche Flatpak
        required: false
        type: string
        default: stable
    secrets:
      INDEX_TOKEN:
        required: true

jobs:
  publier:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      MANIFESTE: ${{ inputs.manifeste }}
      APPLI: ${{ inputs.appli }}
      PAQUET: ${{ inputs.paquet }}
      BRANCHE: ${{ inputs.branche }}
      PROPRIETAIRE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder skopeo jq
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Construire
        # Runtime et SDK du manifeste pris sur Flathub ; pas de FUSE sur les exécuteurs GitHub.
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --default-branch="$BRANCHE" --repo=repo --force-clean build "$MANIFESTE"

      - name: Emballer en OCI
        run: flatpak build-bundle --oci repo bundle "$APPLI" "$BRANCHE"

      - name: Pousser sur ghcr.io
        id: image
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${PROPRIETAIRE,,}/$PAQUET"
          echo "$JETON" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref=$(jq -r '.manifests[0].annotations["org.opencontainers.image.ref.name"]' bundle/index.json)
          skopeo copy "oci:bundle:$ref" "docker://$image:latest"
          skopeo copy "oci:bundle:$ref" "docker://$image:${GITHUB_SHA::12}"
          # Empreinte du manifeste tel que le registre le sert : celle que Flatpak vérifiera.
          echo "digest=sha256:$(skopeo inspect --raw "docker://$image:latest" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Zelsher/arrsa-systemes
          token: ${{ secrets.INDEX_TOKEN }}
          path: index

      - name: Écrire l'entrée de l'index
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 -I index/outils/entree.py bundle "${PROPRIETAIRE,,}/$PAQUET" "$DIGEST" latest \
            > "index/entrees/$APPLI.json"
          cd index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "entrees/$APPLI.json"
          git diff --cached --quiet && { echo "Entrée inchangée."; exit 0; }
          git commit -q -m "$APPLI : ${GITHUB_SHA::12} de ${{ github.repository }}"
          # Deux systèmes peuvent publier en même temps : chacun ne touche que son fichier.
          for _ in 1 2 3 4 5; do
            git push -q && exit 0
            git pull -q --rebase
          done
          exit 1
