# Publier un système (ADR 0140 d'ARRSA) : appelée par l'intégration continue du système, depuis
# son propre dépôt (privé). Construit son Flatpak et le pousse en image OCI privée sur
# ghcr.io/<propriétaire>/<paquet>:latest. Le système n'écrit rien dans ce dépôt-ci : le robot du
# catalogue (catalogue.yml) lit l'image et refait l'index ; aucune clé à créer ni à renouveler.
#
# Dans le dépôt du système :
#   jobs:
#     publier:
#       uses: Zelsher/arrsa-systemes/.github/workflows/publier.yml@main
#       permissions: { contents: read, packages: write }
#       with: { manifeste: paquet/org.arrsa.Atlas.yml, appli: org.arrsa.Atlas, paquet: systemes-atlas }
#
# Après la première publication : ligne dans systemes.toml, et dans les réglages du paquet,
# « Manage Actions access » → arrsa-systemes, rôle Read.
name: Publier un système

on:
  workflow_call:
    inputs:
      manifeste:
        description: Manifeste flatpak-builder, chemin dans le dépôt du système
        required: true
        type: string
      appli:
        description: Identifiant Flatpak (org.arrsa.Atlas)
        required: true
        type: string
      paquet:
        description: Nom de l'image sur ghcr.io, sans le propriétaire (systemes-atlas)
        required: true
        type: string
      branche:
        description: Branche Flatpak
        required: false
        type: string
        default: stable

jobs:
  publier:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      MANIFESTE: ${{ inputs.manifeste }}
      APPLI: ${{ inputs.appli }}
      PAQUET: ${{ inputs.paquet }}
      BRANCHE: ${{ inputs.branche }}
      PROPRIETAIRE: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder skopeo jq
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Construire
        # Runtime et SDK du manifeste pris sur Flathub ; pas de FUSE sur les exécuteurs GitHub.
        # Dossiers de travail hors du code : un manifeste qui copie son dépôt (source `dir`) les
        # emporterait sinon dans le paquet.
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --state-dir="$RUNNER_TEMP/etat" --default-branch="$BRANCHE" --repo="$RUNNER_TEMP/depot" \
            --force-clean "$RUNNER_TEMP/construction" "$MANIFESTE"

      - name: Emballer en OCI
        run: flatpak build-bundle --oci "$RUNNER_TEMP/depot" "$RUNNER_TEMP/paquet" "$APPLI" "$BRANCHE"

      - name: Pousser sur ghcr.io
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${PROPRIETAIRE,,}/$PAQUET"
          echo "$JETON" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          oci="$RUNNER_TEMP/paquet"
          ref=$(jq -r '.manifests[0].annotations["org.opencontainers.image.ref.name"]' "$oci/index.json")
          skopeo copy "oci:$oci:$ref" "docker://$image:latest"
          skopeo copy "oci:$oci:$ref" "docker://$image:${GITHUB_SHA::12}"
          echo "Publié : $image (le catalogue le verra à son prochain passage, 15 min au plus)."
