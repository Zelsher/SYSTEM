# Les systèmes du catalogue : le robot lit ghcr.io/zelsher/<paquet>:latest de chacun.
# Pour en ajouter un : une entrée ici, et dans les réglages du paquet sur GitHub, « Manage Actions
# access » → ajouter le dépôt arrsa-systemes, rôle Read (le paquet est privé). Exemple :
#
# [[systeme]]
# code = "S1"
# appli = "org.arrsa.Atlas"
# paquet = "systemes-atlas"
